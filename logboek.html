<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logboek</title>
<meta name="theme-color" content="#001f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logboek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/logboek-icon-180.png">
<link rel="icon" type="image/png" href="icons/logboek-icon-192.png">
<link rel="stylesheet" href="shared.css">
<style>
/* Logboek: per project en dag werkzaamheden en materieel. Gedeelde stijl staat in shared.css. */
@layer base {
  :root { padding-top: env(safe-area-inset-top, 0px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-dark); }
}
@layer components {
  .wrap { padding-bottom: calc(2rem + var(--nav-h, 0px)); display: grid; gap: 1rem; }
  .two { display: grid; gap: 0.75rem; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 30rem) { .two { grid-template-columns: minmax(0, 1fr) 12rem; } }
  textarea.inp { min-height: 8rem; resize: vertical; line-height: 1.4; }
  .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chips .chip { text-align: left; }
  .chip { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0.2rem 0.9rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; cursor: pointer; font: inherit; font-weight: 600; }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .chip.sug { font-weight: 500; color: var(--ink-2); border-style: dashed; }
  .state { min-height: 1.25rem; }
  .list { display: grid; }
  .day { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; min-height: 3.5rem; padding: 0.5rem 0.25rem; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; text-align: left; width: 100%; cursor: pointer; font: inherit; }
  .day .txt { display: grid; min-width: 0; }
  .day b { font-weight: 600; }
  .day small { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day::after { content: "\203A"; color: var(--ink-2); font-size: 1.4rem; }
  .day.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .empty { margin: 0; color: var(--ink-2); }
  .wx { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 0.5rem; }
  .wx .info { grid-column: 1 / -1; }
  .sec { border-top: 1px solid var(--line); }
  .sec > summary { min-height: 3.25rem; display: flex; align-items: center; gap: 0.75rem; font-weight: 700; font-size: 1.0625rem; cursor: pointer; list-style: none; }
  .sec > summary::-webkit-details-marker { display: none; }
  .sec > summary .sum { margin-left: auto; font-weight: 500; font-size: 0.9375rem; color: var(--ink-2); }
  .sec > summary::after { content: ""; flex: none; width: 0.5rem; height: 0.5rem; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(45deg); transition: transform 0.15s; }
  .sec[open] > summary::after { transform: rotate(-135deg); }
  .secbody { display: grid; gap: 0.6rem; padding-bottom: 1rem; }
  .addgrid { display: grid; gap: 0.5rem; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .addgrid .wide { grid-column: 1 / -1; }
  .rows { display: grid; }
  .rowitem { display: flex; align-items: center; gap: 0.75rem; min-height: 3.25rem; padding: 0.35rem 0; border-bottom: 1px solid var(--line); }
  .rowitem .t { display: grid; min-width: 0; flex: 1; }
  .rowitem .t b { font-weight: 600; overflow-wrap: anywhere; }
  .rowitem .t small { color: var(--ink-2); font-size: 0.875rem; }
  .rowitem .del { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); cursor: pointer; }
  .rowitem .del:active { background: color-mix(in srgb, var(--warn) 14%, transparent); color: var(--warn); }
  .check { display: flex; gap: 0.7rem; align-items: center; min-height: 44px; font-weight: 600; }
  .check input { width: 24px; height: 24px; flex: none; }
  textarea.inp.small { min-height: 5rem; }
  .copyprev { justify-self: start; }
  .daynav { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; margin-bottom: 0.25rem; }
  .daynav b { text-align: center; flex: 1; }
  .bar .in { max-width: var(--wrap-max); margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
  .bar .state { grid-column: 1 / -1; margin: 0; }
  body.inday .wrap { padding-bottom: calc(8.5rem + var(--nav-h, 0px)); }
  .sub { margin: 0 0 0.5rem; }
  #v1, #v2 { display: grid; gap: 1rem; }
  #v1 .btn.primary, #v2 .btn.primary { width: 100%; }
  a.btn { color: var(--ink); }
  #v2 h2 { margin: 0.25rem 0 -0.5rem; }
  #nlist .day { border-bottom: 1px solid var(--line); }
  .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
  .thumbs button { padding: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--field); aspect-ratio: 4 / 3; cursor: pointer; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #pdlg img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; background: #000; }
  #pdlg .actions, #wdlg .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
}
</style>
</head>
<body>
<header class="brand"><div class="in"><span class="dot"></span><h1>Logboek</h1></div></header>
<div class="wrap">
  <div id="noProj" class="card" hidden>
    <h2>Eerst een project</h2>
    <p class="hint">Het logboek werkt per project. Maak er een aan bij Projecten.</p>
    <a class="btn primary" href="projecten.html">Naar Projecten</a>
  </div>
  <section id="v1" hidden>
    <input class="inp" id="psearch" type="search" placeholder="Zoeken" hidden>
    <div class="list" id="plist"></div>
    <button class="btn primary" id="newToday" type="button">Nieuwe dag vandaag</button>
  </section>
  <section id="v2" hidden>
    <button class="btn primary" id="todayBtn" type="button">Vandaag invullen</button>
    <h2>Dagen</h2>
    <div class="list" id="dlist"></div>
    <p class="empty" id="noDays" hidden>Nog geen dagen vastgelegd.</p>
    <button class="btn" id="weekBtn" type="button">Weekrapport PDF</button>
    <a class="btn" id="editProj" href="projecten.html">Project bewerken</a>
  </section>
  <section id="v3" hidden>
    <div class="daynav"><button class="btn sm" id="prevDay" type="button">‹ Vorige dag</button><button class="btn sm" id="nextDay" type="button">Volgende dag ›</button></div>
    <p class="hint sub" id="dayProj"></p>
    <div class="card">
      <div class="field">
        <label for="wxTemp">Weer rond 12:00</label>
        <div class="wx">
          <input class="inp" id="wxTemp" type="number" inputmode="decimal" step="0.1" placeholder="°C" aria-label="Temperatuur in graden Celsius">
          <select class="inp" id="wxDesc" aria-label="Weertype"><option value="">Weertype</option></select>
          <p class="hint info" id="wxInfo"></p>
        </div>
      </div>
      <div class="field"><label for="work">Werkzaamheden</label><textarea class="inp" id="work" placeholder="Wat is er vandaag gedaan?"></textarea></div>
      <button class="btn copyprev" id="copyPrev" type="button" hidden></button>
      <div id="secs"></div>
      <details class="sec" id="sec-extra">
        <summary><span>Meerwerk of afwijking</span><span class="sum" id="sum-extra"></span></summary>
        <div class="secbody">
          <label class="check"><input type="checkbox" id="exOn"> Er is meerwerk of een afwijking</label>
          <div class="secbody" id="exBox" hidden>
            <div class="field"><label for="exWho">Opgedragen door</label><input class="inp" id="exWho" autocomplete="off" placeholder="Naam of functie"></div>
            <div class="field"><label for="exHow">Hoe opgedragen</label><select class="inp" id="exHow"><option>Schriftelijk</option><option>Mondeling</option></select></div>
            <div class="field"><label for="exNote">Omschrijving</label><textarea class="inp small" id="exNote" placeholder="Wat is het meerwerk of de afwijking?"></textarea></div>
          </div>
        </div>
      </details>
      <details class="sec" id="sec-safety">
        <summary><span>Veiligheid</span><span class="sum" id="sum-safety"></span></summary>
        <div class="secbody">
          <label class="check"><input type="checkbox" id="saTool"> Toolbox gehouden</label>
          <label class="check"><input type="checkbox" id="saLmra"> LMRA gedaan</label>
          <label class="check"><input type="checkbox" id="saInc"> Incident of bijna-ongeval</label>
          <div class="field"><label for="saNote">Toelichting</label><textarea class="inp small" id="saNote" placeholder="Wat gebeurde er, wie was erbij?"></textarea></div>
        </div>
      </details>
      <div class="field"><label for="other">Overig</label><textarea class="inp small" id="other" placeholder="Bezoek, afspraken, bijzonderheden"></textarea></div>
      <div class="field">
        <label>Foto's</label>
        <button class="btn" id="shotBtn" type="button">Foto maken</button>
        <input id="shot" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <button class="btn danger" id="delDay" type="button">Dag verwijderen</button>
  </section>
  <p class="hint" id="syncmsg"></p>
  <p class="hint"><span id="ver"></span></p>
</div>
<div class="bar" id="dayBar" hidden>
  <div class="in">
    <p class="hint state" id="state" role="status"></p>
    <button class="btn primary" id="saveBack" type="button">Opslaan en terug</button>
    <button class="btn" id="report" type="button">Dagrapport PDF</button>
  </div>
</div>
<dialog id="wdlg">
  <h2>Weekrapport</h2>
  <div class="daynav"><button class="btn sm" id="wprev" type="button">‹ Vorige week</button><button class="btn sm" id="wnext" type="button">Volgende week ›</button></div>
  <p><b id="wtitle"></b></p>
  <p class="hint" id="wcount"></p>
  <label class="check"><input type="checkbox" id="wphotos"> Foto’s meenemen</label>
  <p class="hint" id="wstate" role="status"></p>
  <div class="actions"><button class="btn primary" id="wmake" type="button">PDF maken</button><button class="btn" id="wclose" type="button">Sluiten</button></div>
</dialog>
<dialog id="ndlg">
  <h2>Kies een project</h2>
  <div class="list" id="nlist"></div>
  <button class="btn" id="nclose" type="button">Annuleren</button>
</dialog>
<dialog id="pdlg">
  <img id="pimg" alt="Foto met stempel">
  <p class="hint" id="pinfo"></p>
  <div class="actions">
    <button class="btn primary" id="psave" type="button">Bewaar in Foto's</button>
    <button class="btn" id="pclose" type="button">Sluiten</button>
    <button class="btn danger" id="pdel" type="button">Verwijderen</button>
  </div>
</dialog>
<script src="sync.js"></script>
<script src="datasync.js"></script>
<script src="version.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'gww.log';            /* [{ v, id, projectId, date, work, equipment:[naam], created, modified }]: één regel per project en dag */
  var PKEY = 'gww.projects';      /* gedeelde projectlijst: hier alleen gelezen */
  var $ = function (id) { return document.getElementById(id); };
  $('ver').textContent = 'Versie ' + APP_VERSION + '.';

  function readJson(k) { try { var v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function loadLog() { return readJson(KEY); }
  function saveLog(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); if (window.GwwData) GwwData.changed(); return true; } catch (e) { setState('Opslaan lukt niet op dit apparaat.'); return false; } }
  function projects() { return readJson(PKEY).filter(function (p) { return p && p.id; }); }
  function setState(t) { $('state').textContent = t; }
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* oudere browser */ }
    return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayLabel(iso) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2], 12);
    return isNaN(d) ? iso : d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '');
  }
  function plabel(p) { return [p.nr, p.name].filter(Boolean).join(' · ') || 'Zonder naam'; }

  /* ---------- gegevens van de dag ----------
     Eén regel per project en dag in `gww.log`. Velden die sinds 1.13.0 zijn toegevoegd (other, crew, machines, stagnation, deliveries,
     extra, safety, weather) zijn optioneel: oudere regels blijven geldig. `equipment` (alleen namen) blijft meegeschreven voor oudere appversies. */
  var WX_DESC = ['Zonnig', 'Wisselend bewolkt', 'Bewolkt', 'Mist', 'Motregen', 'Regen', 'Buien', 'Sneeuw', 'Onweer'];
  var CAUSES = ['Weer', 'Opdrachtgever', 'Kabels en leidingen', 'Levering', 'Materieel', 'Overig'];
  function join(a) { return a.filter(Boolean).join(' · '); }
  var SECS = {
    crew: { title: 'Personeel (partners)', open: true, key: function (r) { return (r.partner || '').toLowerCase(); },
      fields: [{ k: 'partner', ph: 'Partner (bedrijf)', req: true, wide: true }, { k: 'count', ph: 'Aantal', num: true }, { k: 'hours', ph: 'Uren', num: true }],
      text: function (r) { return join([r.partner, r.count ? r.count + ' pers' : '', r.hours ? r.hours + ' u' : '']); },
      parts: function (r) { return [r.partner, join([r.count ? r.count + ' pers' : '', r.hours ? r.hours + ' u' : ''])]; },
      sum: function (l) { var n = 0; l.forEach(function (r) { n += +r.count || 0; }); return l.length ? (n ? n + ' pers' : l.length + '×') : ''; } },
    machines: { title: 'Materieel (partners)', open: true, key: function (r) { return ((r.item || '') + '|' + (r.partner || '')).toLowerCase(); },
      fields: [{ k: 'item', ph: 'Materieel, bijv. Graafmachine 14 ton', req: true, wide: true }, { k: 'partner', ph: 'Partner (bedrijf)' }, { k: 'hours', ph: 'Uren', num: true }],
      text: function (r) { return join([r.item, r.partner, r.hours ? r.hours + ' u' : '']); },
      parts: function (r) { return [r.item, join([r.partner, r.hours ? r.hours + ' u' : ''])]; },
      sum: function (l) { return l.length ? l.length + '×' : ''; } },
    stagnation: { title: 'Stagnatie', key: null,
      fields: [{ k: 'cause', ph: 'Oorzaak', select: CAUSES, req: true, wide: true }, { k: 'hours', ph: 'Uren', num: true }, { k: 'note', ph: 'Toelichting' }],
      text: function (r) { return join([r.cause, r.hours ? r.hours + ' u' : '', r.note]); },
      parts: function (r) { return [r.cause, join([r.hours ? r.hours + ' u' : '', r.note])]; },
      sum: function (l) { var h = 0; l.forEach(function (r) { h += +r.hours || 0; }); return l.length ? (h ? h + ' u' : l.length + '×') : 'geen'; } },
    deliveries: { title: 'Leveringen', key: function (r) { return (r.what || '').toLowerCase(); },
      fields: [{ k: 'what', ph: 'Wat is geleverd', req: true, wide: true }, { k: 'qty', ph: 'Hoeveelheid, bijv. 24 ton' }, { k: 'bon', ph: 'Bonnummer' }],
      text: function (r) { return join([r.what, r.qty, r.bon ? 'bon ' + r.bon : '']); },
      parts: function (r) { return [r.what, join([r.qty, r.bon ? 'bon ' + r.bon : ''])]; },
      sum: function (l) { return l.length ? l.length + '×' : ''; } }
  };
  var LISTS = Object.keys(SECS);
  function copy(v) { return JSON.parse(JSON.stringify(v)); }
  function emptyDay() {
    return { work: '', other: '', crew: [], machines: [], stagnation: [], deliveries: [],
      extra: { on: false, who: '', how: 'Schriftelijk', note: '' }, safety: { toolbox: false, lmra: false, incident: false, note: '' }, weather: null };
  }
  function fromRecord(e) {
    var d = emptyDay(); if (!e) return d;
    d.work = e.work || ''; d.other = e.other || '';
    ['crew', 'stagnation', 'deliveries'].forEach(function (k) { d[k] = Array.isArray(e[k]) ? copy(e[k]) : []; });
    d.machines = Array.isArray(e.machines) ? copy(e.machines) : (e.equipment || []).map(function (n) { return { item: n, partner: '', hours: '' }; });
    if (e.extra) Object.keys(d.extra).forEach(function (k) { if (e.extra[k] !== undefined) d.extra[k] = e.extra[k]; });
    if (e.safety) Object.keys(d.safety).forEach(function (k) { if (e.safety[k] !== undefined) d.safety[k] = e.safety[k]; });
    d.weather = e.weather ? copy(e.weather) : null;
    return d;
  }
  function fields(d) {
    return { work: d.work.trim(), other: d.other.trim(), crew: d.crew, machines: d.machines, equipment: d.machines.map(function (m) { return m.item; }),
      stagnation: d.stagnation, deliveries: d.deliveries, extra: d.extra, safety: d.safety, weather: d.weather };
  }
  function hasContent(d) {
    return !!(d.work.trim() || d.other.trim() || LISTS.some(function (k) { return d[k].length; }) || d.extra.on || d.safety.toolbox || d.safety.lmra || d.safety.incident || d.safety.note.trim());
  }
  var day = emptyDay();
  /* tijdens het typen schrijft renderAll het veld met de cursor niet opnieuw; bij een andere dag of project wel (anders blijft de oude tekst staan) */
  var forceFill = false;
  function busy(id) { return !forceFill && document.activeElement === $(id); }
  /* project en datum van de dag die nu open staat: opslaan gebruikt deze, niet de keuzevelden. Bij een wisseling is het keuzeveld al veranderd voordat er opgeslagen wordt, en dan zou de inhoud bij het verkeerde project belanden. */
  var curPid = '', curDate = '', curPhotoCount = null;

  function find(a, pid, date) { return a.filter(function (e) { return e.projectId === pid && e.date === date; })[0]; }

  /* velden vullen vanuit de opgeslagen regel van dit project en deze dag */
  function loadDay(pid, date) {
    curPid = pid; curDate = date; curPhotoCount = null;
    var e = find(loadLog(), curPid, curDate);
    day = fromRecord(e);
    setState(e ? 'Opgeslagen.' : '');
    forceFill = true; renderAll(); forceFill = false; renderPhotos();
    if (!day.weather && curDate <= todayIso() && (curDate === todayIso() || hasContent(day))) fetchWeather();
  }

  /* opslaan: een lege dag wordt niet bewaard; het id van een bestaande regel blijft gelijk */
  var timer = null;
  function saveNow() {
    clearTimeout(timer); timer = null;
    var pid = curPid, date = curDate;
    if (!pid || !date) return;
    var a = loadLog(), e = find(a, pid, date), now = Date.now();
    if (!hasContent(day) && curPhotoCount === 0) {   /* null = nog niet bekend: dan niets verwijderen */
      if (e) { a = a.filter(function (x) { return x !== e; }); saveLog(a); if (window.GwwData) GwwData.deleted('log/' + pid + '/' + date); }
      setState(''); return;
    }
    if (!hasContent(day) && !e) { setState(''); return; }
    /* alleen schrijven bij een echte wijziging: een nieuw tijdstip zonder wijziging zou bij synchroniseren de stand van een ander apparaat overschrijven */
    var next = fields(day);
    if (e && JSON.stringify(fields(fromRecord(e))) === JSON.stringify(next)) { setState('Opgeslagen.'); return; }
    if (e) { Object.assign(e, copy(next)); e.modified = now; }
    else a.push(Object.assign({ v: 1, id: newId(), projectId: pid, date: date }, copy(next), { created: now, modified: now }));
    if (window.GwwData) GwwData.revived('log/' + pid + '/' + date);
    if (saveLog(a)) setState('Opgeslagen.');
    renderAll();
  }
  function saveSoon() { setState('Bezig met opslaan…'); clearTimeout(timer); timer = setTimeout(saveNow, 500); }

  /* ---------- lijsten (personeel, materieel, stagnatie, leveringen) ---------- */
  function buildSections() {
    var host = $('secs');
    LISTS.forEach(function (name) {
      var s = SECS[name], d = document.createElement('details'); d.className = 'sec'; d.id = 'sec-' + name; if (s.open) d.open = true;
      d.innerHTML = '<summary><span>' + s.title + '</span><span class="sum" id="sum-' + name + '"></span></summary>' +
        '<div class="secbody"><div class="rows" id="list-' + name + '"></div><div class="addgrid" id="grid-' + name + '"></div>' +
        '<button class="btn" type="button" id="add-' + name + '">Toevoegen</button><div class="chips" id="sug-' + name + '"></div></div>';
      host.appendChild(d);
      var grid = d.querySelector('#grid-' + name);
      s.fields.forEach(function (f) {
        var el;
        if (f.select) { el = document.createElement('select'); f.select.forEach(function (o) { var op = document.createElement('option'); op.textContent = o; el.appendChild(op); }); }
        else { el = document.createElement('input'); el.autocomplete = 'off'; el.placeholder = f.ph; if (f.num) { el.type = 'number'; el.inputMode = 'decimal'; el.step = '0.5'; el.min = '0'; } }
        el.className = 'inp' + (f.wide ? ' wide' : ''); el.id = 'f-' + name + '-' + f.k; el.setAttribute('aria-label', f.ph);
        el.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); $('add-' + name).click(); } });
        grid.appendChild(el);
      });
      $('add-' + name).onclick = function () { addRow(name); };
      $('list-' + name).onclick = function (ev) {
        var b = ev.target.closest('.del'); if (!b) return;
        day[name].splice(+b.dataset.i, 1); renderAll(); saveNow();
      };
      $('sug-' + name).onclick = function (ev) {
        var b = ev.target.closest('.chip'); if (!b) return;
        day[name].push(copy(JSON.parse(b.dataset.row))); renderAll(); saveNow();
      };
    });
  }

  /* ---------- foto's met stempel ----------
     De foto wordt bij het maken bewerkt: project, datum en tijd, adres en coördinaten, en (online) een kaartje.
     Bewaard wordt de bewerkte foto, in IndexedDB op dit apparaat (niet gesynchroniseerd: een repo is er niet voor gemaakt).
     Bewaren in Foto's van de iPhone gaat via het deelmenu ("Bewaar afbeelding"); een webapp mag niet rechtstreeks in Foto's schrijven. */
  var PDB = 'gww-photos', PSTORE = 'photos', thumbUrls = [], openPhoto = null;

    });

  function miniMap(pos, size) {
    if (!pos) return Promise.resolve(null);
    var z = 17, n = Math.pow(2, z), s = Math.sin(pos.lat * Math.PI / 180);
    var wx = (pos.lon + 180) / 360 * n * 256, wy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n * 256;
    var half = 128, x0 = Math.floor((wx - half) / 256), x1 = Math.floor((wx + half) / 256), y0 = Math.floor((wy - half) / 256), y1 = Math.floor((wy + half) / 256);

    for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) (function (tx, ty) {
      jobs.push(loadTile('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/' + z + '/' + tx + '/' + ty + '.png').then(function (im) { return { im: im, tx: tx, ty: ty }; }));
    })(tx, ty);

  var posPromise = null;

  /* ---------- dagrapport als PDF ----------

  $('nclose').onclick = closeNew;
  $('nlist').onclick = function (e) { var b = e.target.closest('.day'); if (!b) return; closeNew(); go('#/p/' + encodeURIComponent(b.dataset.pid) + '/' + todayIso()); };

  /* laag 2: de dagen van een project, met een samenvatting per dag */
  function summary(e) {
    var d = fromRecord(e), parts = [];
    if (d.weather && d.weather.temp !== '' && d.weather.temp !== undefined) parts.push(d.weather.temp + ' °C');
    var pers = 0; d.crew.forEach(function (c) { pers += +c.count || 0; });
    if (pers) parts.push(pers + ' pers');
    var h = 0; d.stagnation.forEach(function (r) { h += +r.hours || 0; });
    if (h) parts.push(h + ' u stagnatie'); else if (d.stagnation.length) parts.push('stagnatie');
    if (d.extra.on) parts.push('meerwerk');
    if (d.safety.incident) parts.push('incident');
    return parts;
  }
  function showDays(pid) {
    var p = projectById(pid); if (!p) { replaceTo('#/'); return; }
    curPid = pid; curDate = ''; show(2); setTitle(plabel(p));
    var rows = dayRows(pid), today = todayIso();
    $('todayBtn').textContent = rows.some(function (e) { return e.date === today; }) ? 'Vandaag openen' : 'Vandaag invullen';
    $('todayBtn').dataset.date = today;
    var box = $('dlist'); box.textContent = '';
    rows.forEach(function (e) {
      var parts = summary(e), d = fromRecord(e);
      var line = parts.join(' · ') || (d.work || '').split('\n')[0] || d.machines.map(function (m) { return m.item; }).join(', ') || '';
      var b = document.createElement('button'); b.type = 'button'; b.className = 'day'; b.dataset.date = e.date;
      var t = document.createElement('span'); t.className = 'txt';
      var x = document.createElement('b'); x.textContent = dayLabel(e.date); t.appendChild(x);
      var sm = document.createElement('small'); sm.textContent = line; t.appendChild(sm);
      b.appendChild(t); box.appendChild(b);
      dbDo('readonly', function (st) { return st.index('day').count(dayKey(pid, e.date)); }).then(function (n) { if (n) sm.textContent = (sm.textContent ? sm.textContent + ' · ' : '') + n + (n === 1 ? ' foto' : '’s'); }).catch(function () { /* geen foto-opslag */ });
    });
    $('noDays').hidden = rows.length > 0;
  }
  $('todayBtn').onclick = function () { go('#/p/' + encodeURIComponent(curPid) + '/' + this.dataset.date); };
  $('dlist').onclick = function (e) { var b = e.target.closest('.day'); if (b) go('#/p/' + encodeURIComponent(curPid) + '/' + b.dataset.date); };

  /* laag 3: één dag */
  function showDay(pid, date) {
    var p = projectById(pid); if (!p) { replaceTo('#/'); return; }
    show(3); setTitle(dayLabel(date));
    $('dayProj').textContent = plabel(p);
    $('nextDay').disabled = date >= todayIso();
    $('delDay').dataset.armed = ''; $('delDay').textContent = 'Dag verwijderen';
    loadDay(pid, date);
    window.scrollTo(0, 0);
  }
  $('prevDay').onclick = function () { replaceTo('#/p/' + encodeURIComponent(curPid) + '/' + isoAdd(curDate, -1)); };
  $('nextDay').onclick = function () { if (curDate < todayIso()) replaceTo('#/p/' + encodeURIComponent(curPid) + '/' + isoAdd(curDate, 1)); };
  $('saveBack').onclick = function () { var pid = curPid; saveNow(); go('#/p/' + encodeURIComponent(pid)); };
  $('delDay').onclick = function () {
    var btn = this;
    if (btn.dataset.armed !== '1') { btn.dataset.armed = '1'; btn.textContent = 'Zeker weten? De foto’s van deze dag gaan ook weg.'; return; }
    var pid = curPid, date = curDate;
    clearTimeout(timer); timer = null; curPid = ''; curDate = '';   /* niets meer bewaren van deze dag */
    var a = loadLog(), e = find(a, pid, date);
    if (e) { saveLog(a.filter(function (x) { return x !== e; })); if (window.GwwData) GwwData.deleted('log/' + pid + '/' + date); }
    photosOfDay(pid, date).then(function (list) { return Promise.all(list.map(function (p) { return dbDo('readwrite', function (st) { return st.delete(p.id); }); })); })
      .catch(function () { /* geen foto-opslag */ })
      .then(function () { replaceTo('#/p/' + encodeURIComponent(pid)); });
  };

  /* de router */
  function route() {
    if (view === 3) saveNow();   /* bewaar de dag die we verlaten; curPid en curDate zijn nog van die dag */
    var h = location.hash || '', g = /^#gp=(.+)$/.exec(h);
    if (g) { replaceTo('#/p/' + g[1]); return; }
    var list = projects();
    $('noProj').hidden = list.length > 0;
    if (!list.length) { ['v1', 'v2', 'v3'].forEach(function (id) { $(id).hidden = true; }); $('dayBar').hidden = true; document.body.classList.remove('inday'); view = 0; setTitle('Logboek'); return; }
    var m = /^#\/p\/([^/]+)(?:\/(\d{4}-\d{2}-\d{2}))?$/.exec(h);
    if (!m) { showProjects(); return; }
    var pid = decodeURIComponent(m[1]);
    if (m[2]) showDay(pid, m[2]); else showDays(pid);
  }
  window.addEventListener('hashchange', route);
  route();

  /* synchroniseren (als er gekoppeld is): na het ophalen de huidige laag verversen, behalve als je net iets typt */
  if (window.GwwData) {
    GwwData.onChange(function () {
      if (timer) return;
      if (view === 3) { var s0 = curPid, d0 = curDate; if (s0 && d0) loadDay(s0, d0); } else route();
    });
    if (window.GhSync) GhSync.onStatus(function (s) { $('syncmsg').textContent = s.state === 'ok' ? 'Gesynchroniseerd (foto’s blijven op dit toestel).' : s.state === 'fout' ? 'Synchroniseren mislukt: ' + s.msg : ''; });
    GwwData.run();
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
