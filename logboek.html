<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logboek</title>
<meta name="theme-color" content="#001f38">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Logboek">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/logboek-icon-180.png">
<link rel="icon" type="image/png" href="icons/logboek-icon-192.png">
<link rel="stylesheet" href="shared.css">
<style>
/* Logboek: per project en dag werkzaamheden en materieel. Gedeelde stijl staat in shared.css. */
@layer base {
  :root { padding-top: env(safe-area-inset-top, 0px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-dark); }
}
@layer components {
  .wrap { padding-bottom: calc(2rem + var(--nav-h, 0px)); display: grid; gap: 1rem; }
  .two { display: grid; gap: 0.75rem; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 30rem) { .two { grid-template-columns: minmax(0, 1fr) 12rem; } }
  textarea.inp { min-height: 8rem; resize: vertical; line-height: 1.4; }
  .addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .chip { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 44px; padding: 0.2rem 0.9rem; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; cursor: pointer; font: inherit; font-weight: 600; }
  .chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); }
  .chip.sug { font-weight: 500; color: var(--ink-2); border-style: dashed; }
  .state { min-height: 1.25rem; }
  .list { display: grid; }
  .day { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; min-height: 3.5rem; padding: 0.5rem 0.25rem; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: inherit; text-align: left; width: 100%; cursor: pointer; font: inherit; }
  .day .txt { display: grid; min-width: 0; }
  .day b { font-weight: 600; }
  .day small { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day::after { content: "\203A"; color: var(--ink-2); font-size: 1.4rem; }
  .day.sel { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .empty { margin: 0; color: var(--ink-2); }
  .thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.5rem; }
  .thumbs button { padding: 0; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--field); aspect-ratio: 4 / 3; cursor: pointer; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #pdlg img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; background: #000; }
  #pdlg .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
}
</style>
</head>
<body>
<header class="brand"><div class="in"><span class="dot"></span><h1>Logboek</h1></div></header>
<div class="wrap">
  <div id="noProj" class="card" hidden>
    <h2>Eerst een project</h2>
    <p class="hint">Het logboek werkt per project. Maak er een aan bij Projecten.</p>
    <a class="btn primary" href="projecten.html">Naar Projecten</a>
  </div>
  <div id="main" hidden>
    <div class="card">
      <div class="two">
        <div class="field"><label for="proj">Project</label><select class="inp" id="proj"></select></div>
        <div class="field"><label for="date">Datum</label><input class="inp" id="date" type="date"></div>
      </div>
      <div class="field"><label for="work">Werkzaamheden</label><textarea class="inp" id="work" placeholder="Wat is er vandaag gedaan?"></textarea></div>
      <div class="field">
        <label for="eqin">Materieel</label>
        <div class="addrow"><input class="inp" id="eqin" placeholder="Bijv. Graafmachine 14 ton" autocomplete="off"><button class="btn" id="eqadd" type="button">Toevoegen</button></div>
      </div>
      <div class="chips" id="eqlist" aria-label="Materieel op deze dag"></div>
      <div class="chips" id="eqsug" aria-label="Eerder gebruikt materieel"></div>
      <div class="field">
        <label>Foto's</label>
        <button class="btn" id="shotBtn" type="button">Foto maken</button>
        <input id="shot" type="file" accept="image/*" capture="environment" hidden>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <p class="hint state" id="state" role="status"></p>
      <button class="btn primary" id="report" type="button">Dagrapport als PDF</button>
    </div>
    <div style="margin-top:1rem">
      <h2>Eerdere dagen van dit project</h2>
      <div class="list" id="history"></div>
      <p class="empty" id="noHist" hidden>Nog geen dagen vastgelegd.</p>
    </div>
  </div>
  <p class="hint"><span id="ver"></span></p>
</div>
<dialog id="pdlg">
  <img id="pimg" alt="Foto met stempel">
  <p class="hint" id="pinfo"></p>
  <div class="actions">
    <button class="btn primary" id="psave" type="button">Bewaar in Foto's</button>
    <button class="btn" id="pclose" type="button">Sluiten</button>
    <button class="btn danger" id="pdel" type="button">Verwijderen</button>
  </div>
</dialog>
<script src="version.js"></script>
<script src="nav.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'gww.log';            /* [{ v, id, projectId, date, work, equipment:[naam], created, modified }]: één regel per project en dag */
  var PKEY = 'gww.projects';      /* gedeelde projectlijst: hier alleen gelezen */
  var $ = function (id) { return document.getElementById(id); };
  $('ver').textContent = 'Versie ' + APP_VERSION + '.';

  function readJson(k) { try { var v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function loadLog() { return readJson(KEY); }
  function saveLog(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch (e) { setState('Opslaan lukt niet op dit apparaat.'); return false; } }
  function projects() { return readJson(PKEY).filter(function (p) { return p && p.id; }); }
  function setState(t) { $('state').textContent = t; }
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { /* oudere browser */ }
    return 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function dayLabel(iso) {
    var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2], 12);
    return isNaN(d) ? iso : d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '');
  }
  function plabel(p) { return [p.nr, p.name].filter(Boolean).join(' · ') || 'Zonder naam'; }

  var equipment = [];   /* materieel van de dag die nu open staat */
  /* project en datum van de dag die nu open staat: opslaan gebruikt deze, niet de keuzevelden. Bij een wisseling is het keuzeveld al veranderd voordat er opgeslagen wordt, en dan zou de inhoud bij het verkeerde project belanden. */
  var curPid = '', curDate = '', curPhotoCount = null;

  function find(a, pid, date) { return a.filter(function (e) { return e.projectId === pid && e.date === date; })[0]; }

  /* velden vullen vanuit de opgeslagen regel van dit project en deze dag */
  function loadDay() {
    curPid = $('proj').value; curDate = $('date').value; curPhotoCount = null;
    var e = find(loadLog(), curPid, curDate);
    $('work').value = e ? e.work : '';
    equipment = e ? e.equipment.slice() : [];
    setState(e ? 'Opgeslagen.' : '');
    renderEquipment(); renderHistory(); renderPhotos();
  }

  /* opslaan: een lege dag wordt niet bewaard; het id van een bestaande regel blijft gelijk */
  var timer = null;
  function saveNow() {
    clearTimeout(timer); timer = null;
    var pid = curPid, date = curDate;
    if (!pid || !date) return;
    var work = $('work').value.trim(), a = loadLog(), e = find(a, pid, date), now = Date.now();
    if (!work && !equipment.length && curPhotoCount === 0) {   /* null = nog niet bekend: dan niets verwijderen */
      if (e) { a = a.filter(function (x) { return x !== e; }); saveLog(a); }
      setState(''); renderHistory(); return;
    }
    if (e) { e.work = work; e.equipment = equipment.slice(); e.modified = now; }
    else a.push({ v: 1, id: newId(), projectId: pid, date: date, work: work, equipment: equipment.slice(), created: now, modified: now });
    if (saveLog(a)) setState('Opgeslagen.');
    renderHistory(); renderEquipment();
  }
  function saveSoon() { setState('Bezig met opslaan…'); clearTimeout(timer); timer = setTimeout(saveNow, 500); }

  /* materieel: chips van deze dag, daaronder voorstellen uit eerdere dagen (alle projecten) */
  function renderEquipment() {
    var box = $('eqlist'); box.textContent = '';
    equipment.forEach(function (name, i) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip on'; b.dataset.i = i;
      b.setAttribute('aria-label', name + ' verwijderen'); b.textContent = name + ' ×'; box.appendChild(b);
    });
    var cnt = {};
    loadLog().forEach(function (e) { (e.equipment || []).forEach(function (n) { cnt[n] = (cnt[n] || 0) + 1; }); });
    var sug = Object.keys(cnt).filter(function (n) { return equipment.indexOf(n) === -1; })
      .sort(function (x, y) { return cnt[y] - cnt[x] || x.localeCompare(y); }).slice(0, 6);
    var sb = $('eqsug'); sb.textContent = '';
    sug.forEach(function (n) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'chip sug'; b.dataset.n = n; b.textContent = '+ ' + n; sb.appendChild(b);
    });
  }
  function addEquipment(name) {
    name = String(name || '').replace(/\s+/g, ' ').trim();
    if (!name || equipment.some(function (n) { return n.toLowerCase() === name.toLowerCase(); })) return;
    equipment.push(name); renderEquipment(); saveNow();
  }
  $('eqadd').onclick = function () { addEquipment($('eqin').value); $('eqin').value = ''; $('eqin').focus(); };
  $('eqin').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); $('eqadd').click(); } });
  $('eqin').addEventListener('blur', function () { if ($('eqin').value.trim()) { addEquipment($('eqin').value); $('eqin').value = ''; } });
  $('eqlist').onclick = function (e) {
    var b = e.target.closest('.chip'); if (!b) return;
    equipment.splice(+b.dataset.i, 1); renderEquipment(); saveNow();
  };
  $('eqsug').onclick = function (e) { var b = e.target.closest('.chip'); if (b) addEquipment(b.dataset.n); };

  /* eerdere dagen van het gekozen project */
  function renderHistory() {
    var pid = $('proj').value;
    var rows = loadLog().filter(function (e) { return e.projectId === pid; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var box = $('history'); box.textContent = '';
    rows.forEach(function (e) {
      var b = document.createElement('button'); b.type = 'button'; b.className = 'day' + (e.date === $('date').value ? ' sel' : ''); b.dataset.date = e.date;
      var t = document.createElement('span'); t.className = 'txt';
      var s = document.createElement('b'); s.textContent = dayLabel(e.date); t.appendChild(s);
      var line = (e.work || '').split('\n')[0] || (e.equipment || []).join(', ') || 'Foto\u2019s';
      var sm = document.createElement('small'); sm.textContent = line; t.appendChild(sm);
      b.appendChild(t); box.appendChild(b);
    });
    $('noHist').hidden = rows.length > 0;
  }
  $('history').onclick = function (e) {
    var b = e.target.closest('.day'); if (!b) return;
    saveNow(); $('date').value = b.dataset.date; loadDay(); window.scrollTo({ top: 0 });
  };

  $('work').addEventListener('input', saveSoon);
  $('date').addEventListener('change', function () { if (!$('date').value) $('date').value = todayIso(); saveNow(); loadDay(); });
  $('proj').addEventListener('change', function () { saveNow(); loadDay(); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);

  /* ---------- foto's met stempel ----------
     De foto wordt bij het maken bewerkt: project, datum en tijd, adres en coördinaten, en (online) een kaartje.
     Bewaard wordt de bewerkte foto, in IndexedDB op dit apparaat (niet gesynchroniseerd: een repo is er niet voor gemaakt).
     Bewaren in Foto's van de iPhone gaat via het deelmenu ("Bewaar afbeelding"); een webapp mag niet rechtstreeks in Foto's schrijven. */
  var PDB = 'gww-photos', PSTORE = 'photos', thumbUrls = [], openPhoto = null;
  function openDb() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { rej(new Error('geen opslag')); return; }
      var r = indexedDB.open(PDB, 1);
      r.onupgradeneeded = function () { r.result.createObjectStore(PSTORE, { keyPath: 'id' }).createIndex('day', 'day'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function dbDo(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var tx = db.transaction(PSTORE, mode), out = fn(tx.objectStore(PSTORE));
        tx.oncomplete = function () { db.close(); res(out && out.result !== undefined ? out.result : undefined); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      });
    });
  }
  function dayKey(pid, date) { return pid + '|' + date; }
  function photosOfDay(pid, date) { return dbDo('readonly', function (st) { return st.index('day').getAll(dayKey(pid, date)); }).then(function (a) { return (a || []).sort(function (x, y) { return x.created - y.created; }); }); }

  function getPos() {
    return new Promise(function (res) {
      if (!navigator.geolocation) { res(null); return; }
      var done = false, fin = function (v) { if (!done) { done = true; res(v); } };
      setTimeout(function () { fin(null); }, 9000);
      navigator.geolocation.getCurrentPosition(function (p) { fin({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }); }, function () { fin(null); }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 });
    });
  }
  function timeoutFetch(url, ms) {
    var c = new AbortController(), t = setTimeout(function () { c.abort(); }, ms);
    return fetch(url, { signal: c.signal }).then(function (r) { clearTimeout(t); return r.ok ? r.json() : null; }, function () { clearTimeout(t); return null; });
  }
  /* adres bij de positie (PDOK, Nederland); zonder bereik of buiten Nederland blijft het leeg */
  function addressOf(pos) {
    if (!pos) return Promise.resolve('');
    return timeoutFetch('https://api.pdok.nl/bzk/locatieserver/search/v3_1/reverse?type=adres&rows=1&fl=weergavenaam&lat=' + pos.lat + '&lon=' + pos.lon, 4000)
      .then(function (j) { var d = j && j.response && j.response.docs && j.response.docs[0]; return d ? String(d.weergavenaam || '') : ''; }).catch(function () { return ''; });
  }
  /* kaartje: 2x2 tegels van PDOK rond de positie, bijgesneden tot een vierkant; mislukt het, dan geen kaartje */
  function loadTile(url) {
    return new Promise(function (res) {
      var im = new Image(), t = setTimeout(function () { res(null); }, 4500); im.crossOrigin = 'anonymous';
      im.onload = function () { clearTimeout(t); res(im); }; im.onerror = function () { clearTimeout(t); res(null); }; im.src = url;
    });
  }
  function miniMap(pos, size) {
    if (!pos) return Promise.resolve(null);
    var z = 17, n = Math.pow(2, z), s = Math.sin(pos.lat * Math.PI / 180);
    var wx = (pos.lon + 180) / 360 * n * 256, wy = (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * n * 256;
    var half = 128, x0 = Math.floor((wx - half) / 256), x1 = Math.floor((wx + half) / 256), y0 = Math.floor((wy - half) / 256), y1 = Math.floor((wy + half) / 256);
    var jobs = [];
    for (var ty = y0; ty <= y1; ty++) for (var tx = x0; tx <= x1; tx++) (function (tx, ty) {
      jobs.push(loadTile('https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/' + z + '/' + tx + '/' + ty + '.png').then(function (im) { return { im: im, tx: tx, ty: ty }; }));
    })(tx, ty);
    return Promise.all(jobs).then(function (tiles) {
      if (!tiles.some(function (t) { return t.im; })) return null;
      var c = document.createElement('canvas'); c.width = c.height = size; var g = c.getContext('2d'), k = size / (half * 2);
      g.fillStyle = '#e8eef3'; g.fillRect(0, 0, size, size);
      tiles.forEach(function (t) { if (t.im) g.drawImage(t.im, (t.tx * 256 - (wx - half)) * k, (t.ty * 256 - (wy - half)) * k, 256 * k + 1, 256 * k + 1); });
      g.beginPath(); g.arc(size / 2, size / 2, size * 0.055, 0, 7); g.fillStyle = '#e5322d'; g.fill(); g.lineWidth = size * 0.02; g.strokeStyle = '#fff'; g.stroke();
      return c;
    }).catch(function () { return null; });
  }
  function loadImage(file) {
    if (window.createImageBitmap) { return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return loadImgEl(file); }); }
    return loadImgEl(file);
  }
  function loadImgEl(file) {
    return new Promise(function (res, rej) { var u = URL.createObjectURL(file), im = new Image(); im.onload = function () { URL.revokeObjectURL(u); res(im); }; im.onerror = function () { rej(new Error('geen afbeelding')); }; im.src = u; });
  }
  function fitText(g, text, maxW, size, weight) {
    var px = size; g.font = weight + ' ' + px + 'px system-ui, -apple-system, sans-serif';
    while (g.measureText(text).width > maxW && px > size * 0.6) { px -= 1; g.font = weight + ' ' + px + 'px system-ui, -apple-system, sans-serif'; }
    if (g.measureText(text).width > maxW) { while (text.length > 4 && g.measureText(text + '…').width > maxW) text = text.slice(0, -1); text += '…'; }
    return text;
  }
  /* de stempel: donkere balk onderaan met tekst links en het kaartje rechts */
  function stamp(img, o) {
    var maxEdge = 1600, sc = Math.min(1, maxEdge / Math.max(img.width, img.height));
    var w = Math.round(img.width * sc), h = Math.round(img.height * sc);
    var c = document.createElement('canvas'); c.width = w; c.height = h; var g = c.getContext('2d');
    g.drawImage(img, 0, 0, w, h);
    var pad = Math.round(Math.min(w, h) * 0.02), fs = Math.max(13, Math.round(Math.min(w, h) * 0.029));
    var lines = [{ t: o.title, b: true }, { t: o.when, b: false }];
    if (o.addr) lines.push({ t: o.addr, b: false });
    lines.push({ t: o.coords, b: false });
    var textH = lines.length * Math.round(fs * 1.3), mapSize = o.map ? Math.round(Math.min(w, h) * 0.17) : 0;
    var barH = Math.max(textH, mapSize) + pad * 2;
    g.fillStyle = 'rgba(0,0,0,0.58)'; g.fillRect(0, h - barH, w, barH);
    var textW = w - pad * 3 - (mapSize ? mapSize + pad : 0), y = h - barH + pad + Math.round(fs * 1.0);
    g.fillStyle = '#fff'; g.textBaseline = 'alphabetic';
    lines.forEach(function (l) { g.fillText(fitText(g, l.t, textW, fs, l.b ? 700 : 500), pad, y); y += Math.round(fs * 1.3); });
    if (o.map) { g.drawImage(o.map, w - pad - mapSize, h - barH + (barH - mapSize) / 2, mapSize, mapSize); g.lineWidth = 2; g.strokeStyle = '#fff'; g.strokeRect(w - pad - mapSize, h - barH + (barH - mapSize) / 2, mapSize, mapSize); }
    return new Promise(function (res) { c.toBlob(function (b) { res({ blob: b, w: w, h: h }); }, 'image/jpeg', 0.86); });
  }
  function whenLabel(d) {
    return d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '') + ' · ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
  }

  var posPromise = null;
  $('shotBtn').onclick = function () { posPromise = getPos(); $('shot').click(); };
  $('shot').onchange = function () {
    var file = this.files && this.files[0]; this.value = '';
    if (!file) return;
    var pid = curPid, date = curDate, proj = projects().filter(function (p) { return p.id === pid; })[0], taken = new Date();
    setState('Foto verwerken…');
    var pos = null;
    (posPromise || getPos()).then(function (p) { pos = p; return Promise.all([addressOf(p), miniMap(p, 220), loadImage(file)]); })
      .then(function (r) {
        var coords = pos ? pos.lat.toFixed(5) + ', ' + pos.lon.toFixed(5) + ' (±' + Math.round(pos.acc) + ' m)' : 'Locatie onbekend';
        return stamp(r[2], { title: proj ? plabel(proj) : 'Project', when: whenLabel(taken), addr: r[0], coords: coords, map: r[1] }).then(function (s) {
          var rec = { v: 1, id: newId(), projectId: pid, date: date, day: dayKey(pid, date), blob: s.blob, w: s.w, h: s.h, lat: pos ? pos.lat : null, lon: pos ? pos.lon : null, created: taken.getTime() };
          return dbDo('readwrite', function (st) { return st.put(rec); });
        });
      })
      .then(function () {
        try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) { /* niet beschikbaar */ }
        /* de dag staat nu in het logboek, ook zonder tekst */
        var a = loadLog();
        if (!find(a, pid, date)) { a.push({ v: 1, id: newId(), projectId: pid, date: date, work: '', equipment: [], created: Date.now(), modified: Date.now() }); saveLog(a); }
        setState('Foto bewaard. Tik erop om hem in Foto’s te bewaren.');
        if (curPid === pid && curDate === date) renderPhotos(); renderHistory();
      })
      .catch(function () { setState('De foto kon niet worden verwerkt of bewaard.'); });
  };

  function renderPhotos() {
    return photosOfDay(curPid, curDate).then(function (list) {
      curPhotoCount = list.length;
      thumbUrls.forEach(function (u) { URL.revokeObjectURL(u); }); thumbUrls = [];
      var box = $('thumbs'); box.textContent = '';
      list.forEach(function (p) {
        var b = document.createElement('button'); b.type = 'button'; b.dataset.id = p.id; b.setAttribute('aria-label', 'Foto openen');
        var im = document.createElement('img'), u = URL.createObjectURL(p.blob); thumbUrls.push(u); im.src = u; im.alt = ''; b.appendChild(im); box.appendChild(b);
      });
      box._list = list;
    }).catch(function () { curPhotoCount = 0; });
  }
  $('thumbs').onclick = function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var rec = ($('thumbs')._list || []).filter(function (p) { return p.id === b.dataset.id; })[0]; if (!rec) return;
    openPhoto = rec; if ($('pimg')._u) URL.revokeObjectURL($('pimg')._u);
    $('pimg')._u = URL.createObjectURL(rec.blob); $('pimg').src = $('pimg')._u;
    $('pinfo').textContent = new Date(rec.created).toLocaleString('nl-NL');
    $('pdel').dataset.armed = ''; $('pdel').textContent = 'Verwijderen';
    if ($('pdlg').showModal) $('pdlg').showModal(); else $('pdlg').setAttribute('open', '');
  };
  function closePhoto() { if ($('pdlg').close) $('pdlg').close(); else $('pdlg').removeAttribute('open'); openPhoto = null; }
  $('pclose').onclick = closePhoto;
  $('psave').onclick = function () {
    if (!openPhoto) return;
    var name = 'foto-' + new Date(openPhoto.created).toISOString().slice(0, 19).replace(/[:T]/g, '') + '.jpg';
    var file = new File([openPhoto.blob], name, { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(function () { /* geannuleerd */ }); return; }
    var a = document.createElement('a'); a.href = URL.createObjectURL(openPhoto.blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  $('pdel').onclick = function () {
    if (this.dataset.armed !== '1') { this.dataset.armed = '1'; this.textContent = 'Zeker weten?'; return; }
    var id = openPhoto && openPhoto.id; closePhoto();
    if (id) dbDo('readwrite', function (st) { return st.delete(id); }).then(function () { return renderPhotos(); }).then(function () { saveNow(); });
  };

  /* ---------- dagrapport als PDF ----------
     jsPDF (versie vastgezet) wordt pas geladen als je een rapport maakt; de service worker bewaart hem voor offline gebruik.
     Het rapport bevat project, datum, uitvoerder en telefoon, notitie van het project, werkzaamheden, materieel en de foto's met stempel. */
  var PDF_LIB = 'https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js';
  function loadPdfLib() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
    return new Promise(function (res, rej) {
      var s = document.createElement('script'); s.src = PDF_LIB;
      s.onload = function () { window.jspdf && window.jspdf.jsPDF ? res(window.jspdf.jsPDF) : rej(new Error('geen bibliotheek')); };
      s.onerror = function () { rej(new Error('niet geladen')); };
      document.head.appendChild(s);
    });
  }
  function blobToDataUrl(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  function buildReport(JsPdf, o) {
    var doc = new JsPdf({ unit: 'mm', format: 'a4', compress: true });
    var W = 210, M = 15, CW = W - 2 * M, H = 297, y = 0;
    function header() {
      doc.setFillColor(0, 31, 56); doc.rect(0, 0, W, 22, 'F'); doc.setFillColor(118, 183, 32); doc.rect(0, 22, W, 1.2, 'F');
      doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Dagrapport', M, 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(o.dateText, W - M, 14, { align: 'right' });
      doc.setTextColor(10, 27, 44); y = 32;
    }
    function ensure(h) { if (y + h > H - 18) { doc.addPage(); header(); } }
    function heading(t) { ensure(12); doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text(t, M, y); y += 2; doc.setDrawColor(195, 207, 219); doc.line(M, y, W - M, y); y += 6; }
    function para(t, size) {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(size || 11);
      doc.splitTextToSize(t, CW).forEach(function (line) { ensure(6); doc.text(line, M, y); y += 5.4; });
      y += 2;
    }
    header();
    doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.text(doc.splitTextToSize(o.title, CW), M, y); y += 8 * doc.splitTextToSize(o.title, CW).length;
    var meta = [];
    if (o.who) meta.push('Uitvoerder: ' + o.who);
    if (o.phone) meta.push('Telefoon: ' + o.phone);
    if (meta.length) para(meta.join('   '), 10.5);
    if (o.note) { heading('Projectnotitie'); para(o.note); }
    heading('Werkzaamheden'); para(o.work || 'Geen werkzaamheden vastgelegd.');
    heading('Materieel');
    if (o.equipment.length) o.equipment.forEach(function (n) { ensure(6); doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.text('\u2022  ' + n, M, y); y += 5.6; }); else para('Geen materieel vastgelegd.');
    y += 2;
    if (o.photos.length) {
      heading('Foto\u2019s');
      var gap = 4, pw = (CW - gap) / 2, col = 0, rowH = 0;
      o.photos.forEach(function (p) {
        var ph = pw * p.h / p.w;
        if (col === 0) { ensure(ph + 4); rowH = 0; }
        var x = M + col * (pw + gap);
        doc.addImage(p.data, 'JPEG', x, y, pw, ph); rowH = Math.max(rowH, ph);
        if (col === 1) { y += rowH + gap; col = 0; } else col = 1;
      });
      if (col === 1) y += rowH + gap;
    }
    var n = doc.getNumberOfPages();
    for (var i = 1; i <= n; i++) {
      doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(86, 104, 121);
      doc.text('GWW Tools ' + o.version + '  \u00B7  gemaakt op ' + o.madeOn, M, H - 8);
      doc.text('Pagina ' + i + ' van ' + n, W - M, H - 8, { align: 'right' });
    }
    return doc.output('blob');
  }
  $('report').onclick = function () {
    saveNow();
    var pid = curPid, date = curDate, proj = projects().filter(function (p) { return p.id === pid; })[0], e = find(loadLog(), pid, date);
    var btn = this; btn.disabled = true; setState('Rapport maken\u2026');
    Promise.all([loadPdfLib(), photosOfDay(pid, date)]).then(function (r) {
      return Promise.all(r[1].map(function (p) { return blobToDataUrl(p.blob).then(function (d) { return { data: d, w: p.w, h: p.h }; }); })).then(function (photos) {
        var now = new Date();
        var blob = buildReport(r[0], { title: proj ? plabel(proj) : 'Project', who: proj && proj.who, phone: proj && proj.phone, note: proj && proj.note,
          dateText: dayLabel(date), work: e ? e.work : '', equipment: e ? e.equipment : [], photos: photos, version: APP_VERSION, madeOn: whenLabel(now) });
        var name = 'dagrapport-' + (proj && proj.nr ? proj.nr.replace(/[^\w-]+/g, '') + '-' : '') + date + '.pdf';
        var file = new File([blob], name, { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { return navigator.share({ files: [file] }).catch(function () { /* geannuleerd */ }); }
        var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      });
    }).then(function () { setState('Dagrapport klaar.'); })
      .catch(function () { setState('Het rapport kon niet worden gemaakt. De PDF-bibliotheek laadt alleen met verbinding, de eerste keer.'); })
      .then(function () { btn.disabled = false; });
  };

  /* start: kies het project uit #gp=<id> (vanuit Projecten), anders het laatst gebruikte project in het logboek */
  var list = projects();
  if (!list.length) { $('noProj').hidden = false; }
  else {
    var sel = $('proj');
    list.sort(function (a, b) { return (b.modified || 0) - (a.modified || 0); }).forEach(function (p) {
      var o = document.createElement('option'); o.value = p.id; o.textContent = plabel(p); sel.appendChild(o);
    });
    var m = /^#gp=(.+)$/.exec(location.hash || ''), want = m ? decodeURIComponent(m[1]) : '';
    if (!want) { var last = loadLog().sort(function (a, b) { return b.modified - a.modified; })[0]; want = last ? last.projectId : ''; }
    if (want && list.some(function (p) { return p.id === want; })) sel.value = want;
    if (m) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* geen history */ } }
    $('date').value = todayIso();
    $('main').hidden = false;
    loadDay();
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
